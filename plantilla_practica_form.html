<!DOCTYPE html>
<html lang="es">

<head>
    <title>Formulario básico</title>
</head>

<body>
    <h2>Formulario básico</h2>

    <form action="mailto:aaron.ferrera@educa.madrid.org" method="post">
        <fieldset>
            <legend>Personaje</legend>
            <label>Superhéroe favorito:</label>
            <input list="superheroes" name="superheroe" placeholder="elige superheroe" />
            <datalist id="superheroes">
                <option label="Iron Man" value="Iron_Man"></option>
                <option label="Hulk" value="Hulk"></option>
            </datalist>

            <br>
            <br>

            <label>Color:</label>
            <input name="color" type="color" />

            <br>
            <br>
        </fieldset>
        <fieldset>
            <legend>Datos de usuario</legend>
            <label>Nombre:</label>
            <input type="text" name="username" value="" placeholder="Nombre">
            <br>
            <br>
            <label for="telefono">Número de teléfono:</label>
            <input type="tel" id="telefono" name="telefono" placeholder="1234567" pattern="[0-9]{7}" maxlength="7" required>
            <br>
            <br>

        </fieldset>
        <input type="submit" value="Enviar" />
    </form>
</body>

</html>
