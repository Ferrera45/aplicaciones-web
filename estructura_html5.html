<!DOCTYPE html>
<html>

    <head>
        <title>Estructura de HTML 5</title>
        <style>
            body, h1, ul{
                margin: 0px;
            }

            header{
                background-color: rgb(255, 166, 0);
            }

            article{
                background-color:peru;
            }

            aside{
                background-color: green;
            }

            footer{
                background-color: rgb(228, 139, 31);
            }
        </style>
    </head>
    <body>
        <!-- estructura HTML 5 -->
         <header>
            <h1>Estructura HTML 5</h1>
            <nav>
                <ul>
                    <li><a href="#">Página 1</a></li>
                </ul>
                <ul>
                    <li><a href="#">Página 2</a></li>
                </ul>
                <ul>
                    <li><a href="#">Página 3</a></li>
                </ul>
                <ul>
                    <li><a href="#">Página 4</a></li>
                </ul>
            </nav>
         </header>
         <main>
            <article>
                <section>Sección 1 del artículo</section>
                <section>Sección 2 del artículo</section>
                <section>Sección 3 del artículo</section>
                <section>Sección 4 del artículo</section>
                <aside>
                    <ul>
                        <li>Elemento 1</li>
                        <li>Elemento 2</li>
                    </ul>
                </aside>
            </article>
         </main>
         <footer>
            By el G.O.A.T @Aaron
         </footer>
    </body>
</html>
